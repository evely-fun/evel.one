<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/source-serif-4/index.css" />
    <link rel="stylesheet" href="/node_modules/@fontsource-variable/jetbrains-mono/index.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: #faf8f4;
        color: #38322c;
        font-family: 'Source Serif 4 Variable', serif;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }
      .label {
        font-family: 'JetBrains Mono Variable', monospace;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #8a7f74;
      }
      h1 {
        margin-top: 26px;
        font-size: 64px;
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.015em;
        max-width: 17ch;
        color: #241f1a;
      }
      p.abstract {
        margin-top: 26px;
        font-size: 25px;
        line-height: 1.5;
        max-width: 42ch;
        color: #5a5149;
      }
      .rule { height: 1px; background: rgba(36,31,26,0.22); }
      .meta { display: flex; gap: 64px; padding-top: 22px; }
      .meta dt { font-family: 'JetBrains Mono Variable', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #8a7f74; }
      .meta dd { margin-top: 7px; font-size: 20px; color: #241f1a; }
      .foot { display: flex; justify-content: space-between; align-items: flex-end; }
      .mark { font-family: 'JetBrains Mono Variable', monospace; font-size: 17px; color: #241f1a; }
      .mark span { color: #8a7f74; }
    </style>
  </head>
  <body>
    <div>
      <div class="label">Эвели</div>
      <h1>Telegram, Discord и сайты под ключ</h1>
      <p class="abstract">Боты, мини-приложения и сайты. Проекты, полный прайс и условия одной страницей.</p>
    </div>
    <div>
      <div class="rule"></div>
      <div class="meta">
        <div><dt>Цены</dt><dd>от $30 за проект</dd></div>
        <div><dt>Платформы</dt><dd>Telegram, Discord, веб</dd></div>
        <div><dt>Ответ</dt><dd>в тот же день</dd></div>
      </div>
      <div class="foot" style="margin-top:34px">
        <div class="mark">evel<span>.one</span></div>
      </div>
    </div>
  </body>
</html>
