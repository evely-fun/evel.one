<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf8f4" />
    <title>Эвели. Боты и сайты под ключ</title>
    <meta
      name="description"
      content="Telegram-боты и мини-приложения, Discord-боты, сайты под ключ. Проекты, полный прайс и условия одной страницей."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://evel.one/" />
    <meta property="og:title" content="Эвели. Боты и сайты под ключ" />
    <meta
      property="og:description"
      content="Боты, мини-приложения и сайты. Проекты, полный прайс и условия одной страницей."
    />
    <meta property="og:image" content="https://evel.one/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('evel-theme')
          var dark = stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.dataset.theme = 'dark'
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#151311')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
